[project]
name = "prawdowid"
version = "0.1.0"
description = "PRAWDOWID – weryfikacja informacji oparta na wiarygodnych źródłach (HackNation 2026, MSZ)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",   # formularze WWW
    "jinja2>=3.1",               # szablony WWW (HTMX)
    "slowapi>=0.1.9",            # rate limit

    # Baza danych
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # Pobieranie i ekstrakcja treści
    "httpx>=0.27",
    "trafilatura>=1.12",         # ekstrakcja treści HTML – PRZED oddaniem sprawdzić licencję wersji (alternatywa: readability-lxml)

    # LLM (klient OpenAI-compatible: większość dostawców i self-host vLLM/Ollama)
    "openai>=1.40",

    # Odporność, konfiguracja, logi
    "tenacity>=8.5",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "apscheduler>=3.10,<4",      # harmonogram odświeżania korpusu

    # Kanały
    "discord-py>=2.4",
]

[project.optional-dependencies]
# Lokalne embeddingi – ciężkie (PyTorch), dlatego osobno: uv sync --extra embeddings
embeddings = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",               # mock HTTP dla httpx
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",        # pilnowanie granic modułów
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prawdowid"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
