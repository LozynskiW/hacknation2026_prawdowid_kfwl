[project]
name = "prawdowid"
version = "0.1.0"
description = "PRAWDOWID - weryfikacja informacji oparta na wiarygodnych źródłach (HackNation 2026, MSZ)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Backend i strona WWW
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",   # formularze WWW
    "jinja2>=3.1",               # szablony WWW (HTMX)

    # Skrypty źródeł (scripts/)
    "pyyaml>=6.0",

    # Bot Discorda
    "discord-py>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",               # mock HTTP dla httpx
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prawdowid"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
