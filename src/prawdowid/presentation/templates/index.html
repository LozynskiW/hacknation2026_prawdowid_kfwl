<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prawdowid</title>
  <meta name="description" content="Prawdowid - sprawdzanie, czy informacja jest prawdziwa.">
  <link rel="stylesheet" href="/static/css/prawdowid.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="/static/js/eye.js" defer></script>
</head>
<body>
  <header class="hero">
    <!--
      Oko, ktore obserwuje wszystko (sterowanie: static/js/eye.js). Trzy stany:
      - spoczynek: patrzy na nas, lekko zmruzone, od czasu do czasu mruga,
      - pisanie: otwiera sie i sledzi kursor tekstowy w polu pytania,
      - czekanie na odpowiedz: rozglada sie w lewo i w prawo i mruga, w petli.
    -->
    <figure class="eye" aria-hidden="true">
      <svg class="eye__svg" viewBox="0 -44 400 308" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Ksztalt otwartego oka; przy mrugnieciu obie krzywe schodza sie w jedna linie. -->
          <!-- Stan poczatkowy: lekko zmruzone oko. Ksztalt powiek ustawia static/js/eye.js. -->
          <path id="eye-lids" d="M20 110 Q200 19 380 110 Q200 229 20 110 Z"/>
          <clipPath id="eye-shape">
            <use href="#eye-lids"/>
          </clipPath>
          <radialGradient id="sclera" cx="50%" cy="50%" r="60%">
            <stop offset="0%" style="stop-color: var(--cream)"/>
            <stop offset="80%" style="stop-color: var(--cream)"/>
            <stop offset="100%" style="stop-color: var(--cream-shade)"/>
          </radialGradient>
        </defs>

        <!-- Promienie wokol oka -->
        <g class="eye__rays">
          <path d="M200 6 V-40 M120 22 L100 -18 M280 22 L300 -18 M50 52 L20 22 M350 52 L380 22"/>
          <path d="M200 214 V260 M120 198 L100 238 M280 198 L300 238 M50 168 L20 198 M350 168 L380 198"/>
        </g>

        <g clip-path="url(#eye-shape)">
          <rect x="0" y="0" width="400" height="220" fill="url(#sclera)"/>
          <g class="eye__iris">
            <circle cx="200" cy="110" r="62" class="eye__iris-base"/>
            <circle cx="200" cy="110" r="42" class="eye__iris-fibres"/>
            <circle cx="200" cy="110" r="62" class="eye__iris-ring"/>
            <circle cx="200" cy="110" r="26" class="eye__pupil"/>
            <circle cx="186" cy="96" r="8" class="eye__glint"/>
          </g>
          <!-- Cien gornej powieki - nadaje oku glebie. -->
          <use href="#eye-lids" class="eye__lid-shadow"/>
        </g>
        <use href="#eye-lids" class="eye__outline"/>
      </svg>
    </figure>

    <h1 class="hero__title">PRAWDOWID</h1>
    <p class="hero__tagline">Widzi wszystko. Sprawdza każde słowo.</p>
  </header>

  <main class="check">
    <!--
      Jedno pytanie - jedna odpowiedz. Nie ma historii rozmowy:
      kazde wyslanie formularza zastepuje poprzednia odpowiedz w #answer.
      Backend zwraca fragment templates/result.html (M7, renderer "web").
    -->
    <!-- Pole jak w czacie: jedna linia, rosnie razem z tekstem. Enter wysyla, Shift+Enter - nowa linia. -->
    <form class="ask" method="post" action="/wynik"
          hx-post="/wynik" hx-target="#answer" hx-swap="innerHTML"
          hx-indicator="#ask-busy" hx-disabled-elt="find button">
      <label class="visually-hidden" for="ask-text">Co chcesz sprawdzić?</label>
      <div class="ask__bar">
        <textarea id="ask-text" name="text" class="ask__input" rows="1" maxlength="5000" required
                  placeholder="Co chcesz sprawdzić?"></textarea>
        <button type="submit" class="ask__send" aria-label="Sprawdź" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p id="ask-busy" class="ask__busy" role="status">Sprawdzam w wiarygodnych źródłach…</p>
    </form>

    <!-- Pole odpowiedzi pojawia sie dopiero, gdy jest odpowiedz. -->
    <section id="answer" class="answer" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>Odpowiedzi przygotowuje system wspierany przez sztuczną inteligencję na podstawie wiarygodnych źródeł. Do 5000 znaków lub jeden link. Nie zapisujemy historii pytań.</p>
  </footer>

  <script>
    // Pole pytania jak w czacie.
    (function () {
      var form = document.querySelector('.ask');
      var input = document.getElementById('ask-text');
      var send = form.querySelector('.ask__send');
      var answer = document.getElementById('answer');

      function fit() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 220) + 'px';
        send.disabled = !input.value.trim();
      }

      input.addEventListener('input', fit);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          if (input.value.trim()) form.requestSubmit();
        }
      });

      // Jedno pytanie - jedna odpowiedz: nowe pytanie czysci poprzednia odpowiedz.
      form.addEventListener('htmx:beforeRequest', function () { answer.innerHTML = ''; });
      form.addEventListener('htmx:afterRequest', function (e) {
        if (e.detail.successful) { input.value = ''; fit(); }
      });

      fit();
    })();
  </script>
</body>
</html>
