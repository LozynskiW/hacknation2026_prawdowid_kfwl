# Katalog źródeł PRAWDOWID - lista do audytu.
#
# Zasady kwalifikacji, aktualizacji i wykluczania: docs/ZRODLA.md.
# Korpus z tych źródeł buduje: python scripts/build_corpus.py  (wynik: data/corpus/).
#
# Pola:
#   id          - stały identyfikator źródła
#   publisher   - wydawca
#   url         - adres, z którego pobieramy (lista, RSS albo API)
#   type        - OFFICIAL (urzędowe), MEASUREMENT (pomiary), LEGAL (akty prawne), FACT_CHECK (weryfikacja faktów)
#   tier        - 1 = źródło pierwotne / urzędowe, 2 = wiarygodne źródło wtórne
#   role        - EVIDENCE (może być dowodem), REFERRAL (tylko "sprawdź sam", nigdy dowód)
#   topics      - tematy (taksonomia z docs/MODULY.md)
#   method      - sposób pobrania: GOVPL_LIST, RSS, SEJM_ELI, IMGW_SYNOP, GIOS_AQ, POLICJA_LIST, NONE
#   pages       - ile stron listy pobrać (GOVPL_LIST)
#   refresh     - jak często odświeżać
#   storage     - co przechowujemy: FULL_TEXT, SUMMARY (tytuł + lead + link), DATA (rekord pomiaru), METADATA
#   language    - język treści
#   license     - podstawa ponownego wykorzystania (z linkiem do warunków)
#   status      - ACTIVE albo EXCLUDED (z powodem w exclusion_reason)

